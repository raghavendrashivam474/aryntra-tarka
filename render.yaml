# render.yaml
services:
  - type: web
    name: tarka-backend
    runtime: python
    region: oregon
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt

    startCommand: |
      cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/version

    envVars:
      - key:   OPENAI_API_KEY
        sync:  false
      - key:   ANTHROPIC_API_KEY
        sync:  false
      - key: SQLITE_DB_PATH
        value: /data/tarka.db
      - key:   ENVIRONMENT
        value: production
      - key:   ALLOWED_ORIGINS
        sync:  false

    autoDeploy: true

    disk:
      name:       tarka-data
      mountPath:  /data
      sizeGB:     1